name: TermLink CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test & Build (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Run unit, integration, and security tests
        run: npm test

      - name: Validate npm package tarball
        run: npm pack --dry-run
